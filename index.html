<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalanche L1 Registry</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #e84142; --good: #3fb950; --warn: #d29922; --link: #58a6ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --border:#d0d7de; --text:#1f2328; --dim:#656d76; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .titlebar { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 .ava { color: var(--accent); }
  .titlebar a { color: var(--link); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .titlebar a:hover { text-decoration: underline; }
  .sub { color: var(--dim); margin-bottom: 20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 16px; }
  .card .num { font-size:24px; font-weight:700; }
  .card .lbl { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  input[type=search], select {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font-size:14px;
  }
  input[type=search] { flex:1; min-width:200px; }
  .chip { background:var(--panel); border:1px solid var(--border); color:var(--text);
          border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; }
  .chip.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th, td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--border);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em;
       cursor:pointer; user-select:none; position:sticky; top:0; background:var(--panel); }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:rgba(88,166,255,.07); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size:12.5px; color:var(--dim); }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .tier-A { background:rgba(63,185,80,.15); color:var(--good); }
  .tier-B { background:rgba(88,166,255,.15); color:var(--link); }
  .tier-C { background:rgba(210,153,34,.15); color:var(--warn); }
  .tier-unreachable { background:rgba(139,148,158,.15); color:var(--dim); }
  .yes { color:var(--good); } .no { color:var(--dim); } .stale { color:var(--warn); }
  .count { color:var(--dim); margin:10px 2px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--border);
           border-radius:10px; max-width:720px; width:92vw; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .dhead { display:flex; justify-content:space-between; align-items:center; gap:8px;
           padding:14px 18px; border-bottom:1px solid var(--border); }
  .dhead h2 { margin:0; font-size:17px; }
  .dbody { padding: 12px 18px 18px; max-height:70vh; overflow:auto; }
  .kv { display:grid; grid-template-columns: 190px 1fr; gap:4px 12px; margin-bottom:14px; }
  .kv .k { color:var(--dim); }
  .kv .v { word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size:12.5px; }
  .dbody h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--dim); margin:16px 0 8px; }
  button.x { background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; }
  button.load { background:var(--panel); border:1px solid var(--border); color:var(--link);
                border-radius:6px; padding:5px 12px; cursor:pointer; }
  .err { background:rgba(232,65,66,.12); border:1px solid var(--accent); border-radius:8px;
         padding:14px 18px; margin:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <h1><span class="ava">▲</span> Avalanche L1 Registry</h1>
    <a href="https://github.com/avasnap/l1registry">source + data on GitHub ↗</a>
  </div>
  <div class="sub" id="runinfo">loading…</div>
  <div class="cards" id="cards"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="search name / blockchain id / subnet id / evm chain id…">
    <select id="tier"><option value="">tier: all</option><option>A</option><option>B</option><option>C</option><option>unreachable</option></select>
    <select id="vm"><option value="">vm: all</option><option>subnet-evm</option><option>custom</option><option>unknown</option></select>
  </div>
  <div class="controls" id="presets"></div>
  <table>
    <thead><tr id="headrow"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="count" id="count"></div>
</div>
<dialog id="detail"></dialog>
<script>
const NETWORK = new URLSearchParams(location.search).get("network") || "mainnet";
const DATA = `data/${NETWORK}`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = (s) => s && s.length > 18 ? s.slice(0, 9) + "…" + s.slice(-6) : (s ?? "");

const PRESETS = [
  { key: "all",            label: "All",             f: () => true },
  { key: "public-evm-l1s", label: "Public EVM L1s",  f: d => d.vmType === "subnet-evm" && d.isPermissioned === false && d.isL1 === true },
  { key: "covered",        label: "Tier A (indexed)",f: d => d.dataApiCovered === true },
  { key: "unreachable",    label: "Unreachable",     f: d => d.isPermissioned === true || d.accessTier === "unreachable" },
  { key: "custom-vm",      label: "Custom VM",       f: d => d.vmType === "custom" },
  { key: "stale",          label: "Stale",           f: d => d.stale === true },
];
const COLS = [
  { key: "name",          label: "Name",    val: d => d.name || "(unnamed)" },
  { key: "blockchainId",  label: "Blockchain", val: d => short(d.blockchainId), cls: "mono" },
  { key: "subnetId",      label: "Subnet",  val: d => short(d.subnetId), cls: "mono" },
  { key: "vmType",        label: "VM",      val: d => d.vmType },
  { key: "evmChainId",    label: "EVM id",  val: d => d.evmChainId ?? "" },
  { key: "isL1",          label: "L1",      val: d => d.isL1 ? "✓" : "", cls: d => d.isL1 ? "yes" : "no" },
  { key: "isPermissioned",label: "Perm.",   val: d => d.isPermissioned === true ? "✓" : d.isPermissioned === false ? "" : "?", cls: "no" },
  { key: "accessTier",    label: "Tier",    val: d => `<span class="badge tier-${esc(d.accessTier)}">${esc(d.accessTier)}</span>`, raw: true },
  { key: "stale",         label: "",        val: d => d.stale ? "stale" : "", cls: "stale" },
];

let chains = [], subnets = {}, runs = {}, validators = null;
let preset = "all", sortKey = "name", sortDir = 1;

async function fetchJson(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

function latestRun() {
  return Object.values(runs).sort((a, b) => b.startedAt.localeCompare(a.startedAt))[0];
}

function renderCards() {
  const r = latestRun();
  if (!r) return;
  const t = r.totals;
  const tiers = Object.entries(r.byAccessTier).map(([k, v]) => `${k}:${v}`).join("  ");
  $("cards").innerHTML = [
    [t.blockchains, "blockchains"], [t.subnets, "subnets"], [t.l1s, "L1s"],
    [t.permissioned, "permissioned"], [t.validators, "validators"], [tiers, "by tier"],
  ].map(([n, l]) => `<div class="card"><div class="num">${esc(n)}</div><div class="lbl">${esc(l)}</div></div>`).join("");
  $("runinfo").textContent =
    `${NETWORK} · last sync ${new Date(r.startedAt).toUTCString()} · ` +
    `${r.diff.blockchains.new.length} new / ${r.diff.blockchains.changed.length} changed / ` +
    `${r.diff.blockchains.wentStale.length} went stale · source ${r.enumSource}` +
    (r.enrichmentEnabled ? " + data api" : "");
}

function visibleChains() {
  const q = $("q").value.trim().toLowerCase();
  const tier = $("tier").value, vm = $("vm").value;
  const pf = PRESETS.find(p => p.key === preset).f;
  return chains.filter(d =>
    pf(d) &&
    (!tier || d.accessTier === tier) &&
    (!vm || d.vmType === vm) &&
    (!q || [d.name, d.blockchainId, d.subnetId, d.evmChainId].some(v => v != null && String(v).toLowerCase().includes(q)))
  ).sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return (typeof av === "number" ? av - bv : String(av).localeCompare(String(bv))) * sortDir;
  });
}

function render() {
  $("headrow").innerHTML = COLS.map(c =>
    `<th data-k="${c.key}">${c.label}${sortKey === c.key ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    render();
  });
  const vis = visibleChains();
  $("rows").innerHTML = vis.map((d, i) => `<tr data-i="${i}">` + COLS.map(c => {
    const v = c.raw ? c.val(d) : esc(c.val(d));
    const cls = typeof c.cls === "function" ? c.cls(d) : (c.cls ?? "");
    return `<td class="${cls}">${v}</td>`;
  }).join("") + "</tr>").join("");
  document.querySelectorAll("tbody tr").forEach(tr =>
    tr.onclick = () => openDetail(vis[Number(tr.dataset.i)]));
  $("count").textContent = `${vis.length} of ${chains.length} chains`;
}

function renderPresets() {
  $("presets").innerHTML = PRESETS.map(p =>
    `<button class="chip${p.key === preset ? " active" : ""}" data-k="${p.key}">${p.label} (${chains.filter(p.f).length})</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { preset = b.dataset.k; renderPresets(); render(); });
}

function kv(obj, keys) {
  return `<div class="kv">` + keys.filter(k => obj[k] !== undefined).map(k => {
    let v = obj[k];
    if (v === null) v = "—";
    else if (typeof v === "object") v = JSON.stringify(v);
    return `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`;
  }).join("") + `</div>`;
}

async function openDetail(d) {
  const sub = subnets[d.subnetId];
  const dlg = $("detail");
  dlg.innerHTML = `
    <div class="dhead"><h2>${esc(d.name || "(unnamed)")}</h2>
      <button class="x" onclick="this.closest('dialog').close()">✕</button></div>
    <div class="dbody">
      ${kv(d, ["blockchainId","subnetId","vmId","vmType","evmChainId","isL1","isPermissioned",
               "accessTier","dataApiCovered","managerChainId","managerAddress","conversionId",
               "l1ConversionTxHash","rpcEndpoints","firstSeenAt","lastSeenAt","lastUpdatedAt","stale"])}
      ${d.conflicts?.length ? `<h3>classification conflicts</h3><div class="v mono">${esc(JSON.stringify(d.conflicts))}</div>` : ""}
      <h3>provenance</h3>${kv(d.provenance ?? {}, Object.keys(d.provenance ?? {}))}
      ${sub ? `<h3>subnet</h3>${kv(sub, ["controlKeys","threshold","locktime","blockchainIds","validatorSummary"])}` : ""}
      <h3>validators</h3>
      <div id="vwrap"><button class="load" id="vload">load validator set (${esc(sub?.validatorSummary?.count ?? "?")})</button></div>
    </div>`;
  dlg.showModal();
  $("vload").onclick = async () => {
    $("vload").textContent = "loading…";
    validators ??= await fetchJson(`${DATA}/validators.json`);
    const vs = Object.values(validators).filter(v => v.subnetId === d.subnetId);
    $("vwrap").innerHTML = `<table><thead><tr><th>node</th><th>weight</th><th>connected</th><th>uptime</th></tr></thead><tbody>` +
      vs.map(v => `<tr><td class="mono">${esc(v.nodeId)}</td><td>${esc(v.weight ?? "")}</td>` +
                  `<td>${v.connected === true ? "✓" : v.connected === false ? "✗" : ""}</td>` +
                  `<td>${esc(v.uptime ?? "")}</td></tr>`).join("") + `</tbody></table>`;
  };
}

(async () => {
  try {
    const [c, s, r] = await Promise.all([
      fetchJson(`${DATA}/blockchains.json`),
      fetchJson(`${DATA}/subnets.json`),
      fetchJson(`${DATA}/runs.json`),
    ]);
    chains = Object.values(c); subnets = s; runs = r;
    renderCards(); renderPresets(); render();
    for (const id of ["q", "tier", "vm"]) $(id).oninput = render;
  } catch (e) {
    document.querySelector(".wrap").insertAdjacentHTML("beforeend",
      `<div class="err">Failed to load registry data (${esc(e.message)}). ` +
      `Run <code>bun run registry sync</code> and make sure <code>${esc(DATA)}/</code> is published.</div>`);
  }
})();
</script>
</body>
</html>
